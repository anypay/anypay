<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="320" viewBox="0 0 1200 320" role="img"
     aria-labelledby="title desc">
  <!--
    Anypay README architecture / data-flow visual (1200×320).
    Custom for anypay/anypay core server: invoice → payment flow
    Render with: <img src="docs/assets/architecture.svg" alt="..." width="100%" />
  -->
  <title id="title">Invoice &amp; Payment Flow — Anypay Core Server</title>
  <desc id="desc">Animated architecture showing how merchants create invoices, customers pay with crypto, and settlements are processed through Anypay&apos;s multi-chain plugin system.</desc>

  <defs>
    <linearGradient id="anypay-a-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#007B55"/>
      <stop offset="0.5" stop-color="#00AB55"/>
      <stop offset="1" stop-color="#5BE584"/>
    </linearGradient>
    <linearGradient id="anypay-a-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#007B55" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#5BE584"/>
      <stop offset="1" stop-color="#00AB55" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="anypay-a-orb" cx="50%" cy="20%" r="70%">
      <stop offset="0" stop-color="#00AB55" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#111111" stop-opacity="0"/>
    </radialGradient>
    <pattern id="anypay-a-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#00AB55" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="anypay-a-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="anypay-a-frame">
      <rect x="0" y="0" width="1200" height="320" rx="16" ry="16"/>
    </clipPath>
    <style><![CDATA[
      .ap-a-dash { stroke-dasharray: 6 14; animation: ap-a-dash 2.4s linear infinite; }
      .ap-a-pulse { animation: ap-a-pulse 2.6s ease-in-out infinite; }
      .ap-a-pulse-2 { animation: ap-a-pulse 2.6s ease-in-out 0.4s infinite; }
      .ap-a-pulse-3 { animation: ap-a-pulse 2.6s ease-in-out 0.8s infinite; }
      .ap-a-pulse-4 { animation: ap-a-pulse 2.6s ease-in-out 1.2s infinite; }
      .ap-a-dot { offset-path: path('M 170 168 L 1030 168'); offset-rotate: 0deg; animation: ap-a-travel 3.8s linear infinite; }
      .ap-a-dot-b { offset-path: path('M 170 168 L 1030 168'); offset-rotate: 0deg; animation: ap-a-travel 3.8s linear 1.25s infinite; }
      .ap-a-dot-c { offset-path: path('M 170 168 L 1030 168'); offset-rotate: 0deg; animation: ap-a-travel 3.8s linear 2.5s infinite; }
      @keyframes ap-a-dash { to { stroke-dashoffset: -80; } }
      @keyframes ap-a-pulse {
        0%, 100% { opacity: 0.55; }
        50%      { opacity: 1; }
      }
      @keyframes ap-a-travel {
        0%   { offset-distance: 0%;   opacity: 0; }
        8%   { opacity: 1; }
        92%  { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .ap-a-dash, .ap-a-pulse, .ap-a-pulse-2, .ap-a-pulse-3, .ap-a-pulse-4,
        .ap-a-dot, .ap-a-dot-b, .ap-a-dot-c { animation: none !important; opacity: 0.85; }
      }
    ]]></style>
  </defs>

  <g clip-path="url(#anypay-a-frame)">
    <rect width="1200" height="320" fill="#161C24"/>
    <rect width="1200" height="320" fill="url(#anypay-a-orb)"/>
    <rect width="1200" height="320" fill="url(#anypay-a-grid)"/>
    <rect x="1.5" y="1.5" width="1197" height="317" rx="14.5"
          fill="none" stroke="#212B36" stroke-width="2"/>
    <rect x="8" y="8" width="1184" height="304" rx="10"
          fill="none" stroke="#00AB55" stroke-opacity="0.2" stroke-width="1"/>

    <text x="36" y="44"
          font-family="ui-sans-serif, system-ui, 'Public Sans', Inter, 'Helvetica Neue', Arial, sans-serif"
          font-size="16" font-weight="700" letter-spacing="1.4" fill="#5BE584">HOW IT WORKS</text>
    <text x="36" y="72"
          font-family="ui-sans-serif, system-ui, 'Public Sans', Inter, 'Helvetica Neue', Arial, sans-serif"
          font-size="22" font-weight="700" fill="#FFFFFF">Invoice → Payment → Chain Plugins → Settlement</text>

    <!-- Trunk line -->
    <line x1="170" y1="168" x2="1030" y2="168" stroke="#007B55" stroke-width="3" stroke-opacity="0.55"/>
    <line class="ap-a-dash" x1="170" y1="168" x2="1030" y2="168" stroke="url(#anypay-a-line)" stroke-width="2.5"/>

    <!-- Traveling particles (CSS offset-path). SMIL fallback below for older renderers. -->
    <circle class="ap-a-dot"   r="5" fill="#5BE584" filter="url(#anypay-a-glow)"/>
    <circle class="ap-a-dot-b" r="4" fill="#00AB55" filter="url(#anypay-a-glow)"/>
    <circle class="ap-a-dot-c" r="3.5" fill="#C8FACD"/>

    <!-- SMIL fallback particles -->
    <g>
      <circle r="4" fill="#5BE584" opacity="0.9">
        <animateMotion dur="3.8s" repeatCount="indefinite" path="M170 168 L1030 168"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle r="3.5" fill="#00AB55" opacity="0.9">
        <animateMotion dur="3.8s" begin="1.25s" repeatCount="indefinite" path="M170 168 L1030 168"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3.8s" begin="1.25s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Node 1: Merchant creates invoice -->
    <g transform="translate(170 168)">
      <circle class="ap-a-pulse" r="28" fill="#00AB55" fill-opacity="0.10" stroke="#00AB55" stroke-width="1.5"/>
      <circle r="12" fill="#161C24" stroke="#5BE584" stroke-width="2.5"/>
      <circle r="5" fill="#5BE584"/>
      <text y="56" text-anchor="middle"
            font-family="ui-sans-serif, system-ui, 'Public Sans', Inter, 'Helvetica Neue', Arial, sans-serif"
            font-size="13" font-weight="700" fill="#FFFFFF">Merchant</text>
      <text y="74" text-anchor="middle"
            font-family="ui-sans-serif, system-ui, 'Public Sans', Inter, 'Helvetica Neue', Arial, sans-serif"
            font-size="11" font-weight="400" fill="#919EAB">Creates Invoice</text>
    </g>
    
    <!-- Node 2: Invoice API -->
    <g transform="translate(457 168)">
      <circle class="ap-a-pulse-2" r="28" fill="#00AB55" fill-opacity="0.10" stroke="#00AB55" stroke-width="1.5"/>
      <circle r="12" fill="#161C24" stroke="#00AB55" stroke-width="2.5"/>
      <circle r="5" fill="#00AB55"/>
      <text y="56" text-anchor="middle"
            font-family="ui-sans-serif, system-ui, 'Public Sans', Inter, 'Helvetica Neue', Arial, sans-serif"
            font-size="13" font-weight="700" fill="#FFFFFF">Invoice API</text>
      <text y="74" text-anchor="middle"
            font-family="ui-sans-serif, system-ui, 'Public Sans', Inter, 'Helvetica Neue', Arial, sans-serif"
            font-size="11" font-weight="400" fill="#919EAB">Multi-chain URI</text>
    </g>
    
    <!-- Node 3: Chain Plugins -->
    <g transform="translate(743 168)">
      <circle class="ap-a-pulse-3" r="28" fill="#00AB55" fill-opacity="0.10" stroke="#00AB55" stroke-width="1.5"/>
      <circle r="12" fill="#161C24" stroke="#00AB55" stroke-width="2.5"/>
      <circle r="5" fill="#00AB55"/>
      <text y="56" text-anchor="middle"
            font-family="ui-sans-serif, system-ui, 'Public Sans', Inter, 'Helvetica Neue', Arial, sans-serif"
            font-size="13" font-weight="700" fill="#FFFFFF">Chain Plugins</text>
      <text y="74" text-anchor="middle"
            font-family="ui-sans-serif, system-ui, 'Public Sans', Inter, 'Helvetica Neue', Arial, sans-serif"
            font-size="11" font-weight="400" fill="#919EAB">BTC·ETH·XRPL·SOL</text>
    </g>
    
    <!-- Node 4: Settlement &amp; Webhooks -->
    <g transform="translate(1030 168)">
      <circle class="ap-a-pulse-4" r="28" fill="#00AB55" fill-opacity="0.10" stroke="#5BE584" stroke-width="1.5"/>
      <circle r="12" fill="#161C24" stroke="#5BE584" stroke-width="2.5"/>
      <circle r="5" fill="#5BE584"/>
      <text y="56" text-anchor="middle"
            font-family="ui-sans-serif, system-ui, 'Public Sans', Inter, 'Helvetica Neue', Arial, sans-serif"
            font-size="13" font-weight="700" fill="#FFFFFF">Settlement</text>
      <text y="74" text-anchor="middle"
            font-family="ui-sans-serif, system-ui, 'Public Sans', Inter, 'Helvetica Neue', Arial, sans-serif"
            font-size="11" font-weight="400" fill="#919EAB">Confirmed &amp; Paid</text>
    </g>

    <rect x="0" y="312" width="1200" height="8" fill="url(#anypay-a-bar)"/>
  </g>
</svg>
